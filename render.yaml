services:
  - type: web
    name: stylish-name
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: stylish-name-db
          property: connectionString
      - key: JWT_ISSUER
        value: stylish-name
      - key: JWT_AUDIENCE
        value: stylish-name-web
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_PROVIDER_BASE_URL
        sync: false
      - key: PAYMENT_PROVIDER_BASE_URL
        sync: false
      - key: VERIFICATION_PROVIDER_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

databases:
  - name: stylish-name-db
    plan: starter
    databaseName: stylish_name
    user: stylish_name
